<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Salah</title>
<meta name="description" content="A personal Islamic reference library: Salah recitations, Surahs and Duas with Arabic, Urdu and English.">
<meta name="theme-color" content="#f7f3ea" id="meta-theme">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preload" href="assets/fonts/ScheherazadeNew-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script>
// Apply saved theme before first paint (no flash).
(function () {
  try {
    var t = localStorage.getItem('mysalah.theme');
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<div class="app">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="My Salah — home">
      <span class="brand-mark" aria-hidden="true">☪</span><span class="brand-name">My Salah</span>
    </a>
    <span id="offline-pill" class="pill" hidden>Offline</span>
    <div class="top-actions">
      <a class="icon-btn" href="#/search" aria-label="Search" title="Search">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </a>
      <button class="icon-btn" id="btn-settings" aria-label="Reading settings" aria-expanded="false" title="Text size and theme">
        <span class="aa" aria-hidden="true">Aa</span>
      </button>
    </div>
  </header>

  <nav class="nav" id="nav" aria-label="Main"></nav>

  <main id="view" tabindex="-1"></main>
</div>

<div class="sheet" id="settings" hidden role="dialog" aria-label="Reading settings">
  <div class="sheet-card">
    <div class="sheet-head"><strong>Reading settings</strong><button class="icon-btn" id="settings-close" aria-label="Close">✕</button></div>
    <div class="row"><span>Theme</span>
      <div class="seg" role="group" aria-label="Theme">
        <button data-theme-set="light">Light</button><button data-theme-set="dark">Dark</button>
      </div></div>
    <div class="row"><span lang="ar" class="lbl-ar">عربی</span><span class="lbl">Arabic size</span>
      <div class="stepper" data-size="ar"><button data-dir="-1" aria-label="Smaller Arabic">A−</button><output></output><button data-dir="1" aria-label="Larger Arabic">A+</button></div></div>
    <div class="row"><span lang="ur" class="lbl-ar">اردو</span><span class="lbl">Urdu size</span>
      <div class="stepper" data-size="ur"><button data-dir="-1" aria-label="Smaller Urdu">A−</button><output></output><button data-dir="1" aria-label="Larger Urdu">A+</button></div></div>
    <div class="row"><span class="lbl-ar">En</span><span class="lbl">English size</span>
      <div class="stepper" data-size="en"><button data-dir="-1" aria-label="Smaller English">A−</button><output></output><button data-dir="1" aria-label="Larger English">A+</button></div></div>
    <div class="row"><span class="lbl-ar">⎙</span><span class="lbl">Print / Save as PDF</span>
      <div class="stepper"><button id="btn-print" class="wide">Print this page</button></div></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<noscript><p style="padding:2rem">My Salah needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
